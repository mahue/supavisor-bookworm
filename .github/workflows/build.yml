name: Build & Publish supavisor-bookworm

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      supavisor_tag:
        description: "supavisor git tag to build (e.g. v2.9.7)"
        required: true
        default: "v2.9.7"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mahue/supavisor-bookworm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout supavisor source at target tag
        uses: actions/checkout@v4
        with:
          repository: supabase/supavisor
          ref: ${{ github.event.inputs.supavisor_tag || 'v2.9.7' }}
          path: supavisor-src

      - name: Copy Dockerfile into supavisor source
        run: cp Dockerfile supavisor-src/Dockerfile

      - name: Copy limits.sh if not present in source
        run: |
          if [ ! -f supavisor-src/limits.sh ]; then
            cp limits.sh supavisor-src/limits.sh
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=2.9.7-bookworm,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./supavisor-src
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.30.0
        with:
          image-ref: "ghcr.io/mahue/supavisor-bookworm:2.9.7-bookworm"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL"
          ignore-unfixed: false

      - name: Push image (only on main/tags, only if Trivy passes)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./supavisor-src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
